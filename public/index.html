<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>QR Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='white'/><rect x='10' y='10' width='80' height='80' rx='8' fill='none' stroke='black' stroke-width='16'/><rect x='38' y='38' width='24' height='24' fill='black'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css on every image build, so the stylesheet is
       regenerated from THIS commit's markup and can never drift behind the
       code. Write class names as whole literals — a class assembled from
       fragments at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform's native UI kit, centrally hosted and loaded by RELATIVE
       path (server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-native/v1/native.js"></script>
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path. It
       is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, and how the page's colour reaches the shell.
       It is also where the app learns the viewer's light/dark theme: the
       script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
  <!-- The QR encoder, then the app. Both deferred; order is preserved. -->
  <script src="/qr.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="mx-auto flex w-full max-w-md flex-col gap-5 px-4 pb-16 pt-8">

    <!-- Header -->
    <header class="flex items-center gap-3">
      <svg class="h-10 w-10 shrink-0 text-fg" viewBox="0 0 44 44" fill="none" aria-hidden="true">
        <path d="M4 16V8a4 4 0 0 1 4-4h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M28 4h8a4 4 0 0 1 4 4v8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M40 28v8a4 4 0 0 1-4 4h-8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <rect x="4" y="28" width="16" height="12" rx="2" fill="currentColor"/>
      </svg>
      <h1 class="text-title">QR Studio</h1>
    </header>

    <!-- Staging demo note (server says what ?demo=1 filled in) -->
    <p id="demo-note" hidden class="rounded-lg border border-line bg-surface px-3 py-2 text-small text-muted"></p>

    <!-- Link / Text / Contact / Image: real radio buttons, Link on load -->
    <div class="segmented" role="radiogroup" aria-label="What the code is for">
      <label class="seg">
        <input type="radio" name="mode" value="link" checked>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/></svg>
        Link
      </label>
      <label class="seg">
        <input type="radio" name="mode" value="text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Text
      </label>
      <label class="seg">
        <input type="radio" name="mode" value="contact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        Contact
      </label>
      <label class="seg">
        <input type="radio" name="mode" value="image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 17l-5-5-9 8"/></svg>
        Image
      </label>
    </div>

    <form id="qr-form" novalidate class="flex flex-col gap-4">
      <!-- Link -->
      <fieldset data-mode="link" class="flex flex-col gap-2 border-0 p-0 m-0">
        <label for="link-input" class="section-label mb-0">Link</label>
        <input id="link-input" class="field" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. example.com/park-tickets">
        <p id="link-error" class="field-error" hidden></p>
      </fieldset>

      <!-- Text -->
      <fieldset data-mode="text" hidden class="flex flex-col gap-2 border-0 p-0 m-0">
        <label for="text-input" class="section-label mb-0">Text</label>
        <textarea id="text-input" class="field" rows="5" placeholder="e.g. Wi-Fi password for the guest room"></textarea>
        <p id="text-counter" class="px-1 text-small text-muted"></p>
        <p id="text-error" class="field-error" hidden></p>
      </fieldset>

      <!-- Contact -->
      <fieldset data-mode="contact" hidden class="flex flex-col gap-2 border-0 p-0 m-0">
        <label for="contact-name" class="section-label mb-0">Name</label>
        <input id="contact-name" class="field" type="text" autocomplete="off" placeholder="e.g. Sam Example">
        <p id="contact-name-error" class="field-error" hidden></p>

        <label for="contact-phone" class="section-label mb-0 mt-1">Phone</label>
        <input id="contact-phone" class="field" type="tel" autocomplete="off" placeholder="e.g. +1 555 0100">
        <p id="contact-phone-error" class="field-error" hidden></p>

        <label for="contact-email" class="section-label mb-0 mt-1">Email</label>
        <input id="contact-email" class="field" type="email" autocomplete="off" placeholder="e.g. sam@example.com">
        <p id="contact-email-error" class="field-error" hidden></p>
      </fieldset>

      <!-- Image: a link code with a picture from this device drawn in the
           middle. The picture stays on the device; the code holds only the
           link. -->
      <fieldset data-mode="image" hidden class="flex flex-col gap-2 border-0 p-0 m-0">
        <label class="section-label mb-0">Picture</label>
        <div class="flex flex-wrap items-center gap-2">
          <button id="image-pick" type="button" class="btn-secondary">Choose picture</button>
          <button id="image-remove" type="button" class="btn-secondary" hidden>Remove</button>
        </div>
        <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only" tabindex="-1" aria-hidden="true">
        <p id="image-name" hidden class="px-1 text-small text-muted"></p>
        <p id="image-file-error" class="field-error" hidden></p>

        <label for="image-link" class="section-label mb-0 mt-1">Link</label>
        <input id="image-link" class="field" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. example.com/park-tickets">
        <p id="image-link-error" class="field-error" hidden></p>
      </fieldset>

      <button id="generate" type="submit" class="btn-primary h-12 w-full">Generate</button>
    </form>

    <!-- Preview: the scanner frame is this app's signature element -->
    <section id="preview" class="flex flex-col items-center gap-3">
      <div class="qr-frame">
        <span class="qr-corner tl" aria-hidden="true"></span>
        <span class="qr-corner tr" aria-hidden="true"></span>
        <span class="qr-corner bl" aria-hidden="true"></span>
        <span class="qr-corner br" aria-hidden="true"></span>
        <div class="qr-paper">
          <canvas id="qr-canvas" hidden role="img"></canvas>
          <div id="qr-empty" class="state-empty">
            <p>Your code appears here</p>
            <p class="text-small">Fill in the details above and tap Generate.</p>
          </div>
        </div>
      </div>
      <p id="qr-caption" aria-live="polite" hidden class="text-center text-small text-muted"></p>
      <p id="qr-note" aria-live="polite" hidden class="text-center text-small text-muted"></p>
      <div id="qr-actions" class="grid w-full grid-cols-2 gap-2" hidden>
        <button id="download" type="button" class="btn-secondary w-full">Download PNG</button>
        <button id="download-svg" type="button" class="btn-secondary w-full">Download SVG</button>
        <button id="copy" type="button" class="btn-secondary w-full" hidden>Copy image</button>
        <button id="share" type="button" class="btn-secondary w-full" hidden>Share</button>
      </div>
    </section>

    <p class="text-center text-small text-muted">Codes are made on your device. Nothing you type or choose is saved.</p>
  </main>
</body>
</html>
